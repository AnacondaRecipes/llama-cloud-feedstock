{% set name = "llama-cloud" %}
{% set version = "2.19.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/llama_cloud-{{ version }}.tar.gz
  sha256: 17cd945511c3f6bc2f64d73ec5ea24b31ed7d2401b49026a94d7d02b92c5fbf5

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling ==1.26.3
    - hatch-fancy-pypi-readme
  run:
    - python
    - pydantic >=1.9.0,<3
    - httpx >=0.23.0,<1
    - certifi >=2024.7.4
    - typing_extensions >=4.14,<5
    - anyio >=3.5.0,<5
    - distro >=1.7.0,<2
    - sniffio
  run_constrained:
    - httpx_aiohttp >=0.1.9

test:
  imports:
    - llama_cloud
    - llama_cloud.client
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://cloud.llamaindex.ai
  summary: Turn your enterprise data into production-ready LLM applications
  description: |
    llama-cloud is the Python client for LlamaCloud, providing APIs for
    building production-ready LLM applications.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/run-llama/llama_cloud
  doc_url: https://docs.cloud.llamaindex.ai

extra:
  recipe-maintainers:
    - jan-janssen
